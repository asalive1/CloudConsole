services:
  audio-engine:
    build:
      context: .
      dockerfile: audio-engine/Dockerfile
    environment:
      BIND_ADDRESS: 0.0.0.0:8001
      RUST_LOG: info
      AUDIO_INPUT_PORTS: ${AUDIO_INPUT_PORTS:-${ENGINE_UDP_PORTS:-7010-7019}}
    ports:
      - "${ENGINE_UDP_PORTS:-7010-7019}:${ENGINE_UDP_PORTS:-7010-7019}/udp"
      - "${METADATA_TCP_PORTS:-7010-7019}:${METADATA_TCP_PORTS:-7010-7019}/tcp"
    expose:
      - "8001"
    restart: unless-stopped

  janus:
    build:
      context: .
      dockerfile: janus/Dockerfile
    environment:
      DOCKER_IP: ${JANUS_PUBLIC_ADDRESS:-}
      JANUS_RTP_PORT_RANGE: ${JANUS_RTP_PORT_RANGE:-7020-7099}
    ports:
      - "${JANUS_RTP_PORT_RANGE:-7020-7099}:${JANUS_RTP_PORT_RANGE:-7020-7099}/udp"
    expose:
      - "8088"
      - "8188"
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    environment:
      MTX_AUTHINTERNALUSERS_0_USER: ${WHIP_WHEP_USERNAME:-cloudconsole-stream}
      MTX_AUTHINTERNALUSERS_0_PASS: ${WHIP_WHEP_PASSWORD:-local-development-whip-whep-password-change-me}
      MTX_WEBRTCADDRESS: :8889
      MTX_WEBRTCLOCALUDPADDRESS: :${MEDIAMTX_UDP_PORT:-7100}
      MTX_WEBRTCADDITIONALHOSTS_0: ${JANUS_PUBLIC_ADDRESS:-}
      MTX_WEBRTCICESERVERS2_0_URL: ${STUN_SERVER:-stun:stun.l.google.com:19302}
      MTX_WEBRTCICESERVERS2_1_URL: ${TURN_SERVER_URL:-stun:stun.l.google.com:19302}
      MTX_WEBRTCICESERVERS2_1_USERNAME: ${TURN_SERVER_USERNAME:-}
      MTX_WEBRTCICESERVERS2_1_PASSWORD: ${TURN_SERVER_CREDENTIAL:-}
    ports:
      - "${MEDIAMTX_UDP_PORT:-7100}:${MEDIAMTX_UDP_PORT:-7100}/udp"
    expose:
      - "8889"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://cloud_console:cloud_console@postgres:5432/cloud_console}
      STATION_API_KEY: ${STATION_API_KEY:-local-development-key-change-me}
      GUEST_JWT_SECRET: ${GUEST_JWT_SECRET:-local-development-jwt-secret-change-me}
      STATION_ID: ${STATION_ID:-00000000-0000-0000-0000-000000000001}
      AUDIO_ENGINE_URL: http://audio-engine:8001
      JANUS_HTTP_URL: http://janus:8088/janus
      JANUS_ROOM_ID: ${JANUS_ROOM_ID:-4815162342}
      JANUS_CUE_ROOM_ID: ${JANUS_CUE_ROOM_ID:-}
      JANUS_ROOM_PIN: ${JANUS_ROOM_PIN:-local-development-room-pin-change-me}
      STUN_SERVER: ${STUN_SERVER:-}
      TURN_SERVER_URL: ${TURN_SERVER_URL:-}
      TURN_SERVER_USERNAME: ${TURN_SERVER_USERNAME:-}
      TURN_SERVER_CREDENTIAL: ${TURN_SERVER_CREDENTIAL:-}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      audio-engine:
        condition: service_started
      janus:
        condition: service_started
      mediamtx:
        condition: service_started
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "5173"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cloud_console
      POSTGRES_USER: cloud_console
      POSTGRES_PASSWORD: cloud_console
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud_console -d cloud_console"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      - backend
      - frontend
      - janus
      - mediamtx
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-7002}:80"
    restart: unless-stopped

volumes:
  postgres-data:
