services:
  nginx:
    image: nginx:1.27-alpine
    network_mode: host
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  certbot:
    image: certbot/certbot:v3.0.1
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - ./webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  letsencrypt:
