name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path backend/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path backend/Cargo.toml --locked

  audio-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GStreamer development libraries and runtime plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: audio-engine
      - run: cargo fmt --manifest-path audio-engine/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path audio-engine/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path audio-engine/Cargo.toml --locked

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: cloud-console-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: cloud-console-frontend:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: audio-engine/Dockerfile
          push: false
          tags: cloud-console-audio-engine:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: false
          tags: cloud-console-nginx:ci
